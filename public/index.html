<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Notes Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fafafa; --surface: #ffffff; --sunken: #f4f4f5; --ink: #18181b; --muted: #71717a; --faint: #a1a1aa;
    --line: #e4e4e7; --accent: #047857; --accent-ink: #ffffff; --accent-soft: #ecfdf5; --accent-line: #a7f3d0;
    --bad: #b42318; --bad-soft: #fef3f2; --warn: #b54708; --shadow: 0 18px 40px -22px rgba(24, 24, 27, .18);
    --ease: cubic-bezier(.16, 1, .3, 1);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e0e10; --surface: #17171a; --sunken: #1f1f23; --ink: #f4f4f5; --muted: #a1a1aa; --faint: #71717a;
      --line: #2a2a2f; --accent: #34d399; --accent-ink: #052e22; --accent-soft: #0c2a20; --accent-line: #14532d;
      --bad: #f97066; --bad-soft: #2a1513; --warn: #fdb022; --shadow: 0 18px 40px -22px rgba(0, 0, 0, .7);
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 Geist, ui-sans-serif, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .mono { font-family: "Geist Mono", ui-monospace, monospace; font-feature-settings: "tnum"; }
  svg.i { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .hidden { display: none !important; }

  /* shell */
  #app { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 100dvh; }
  aside { position: sticky; top: 0; height: 100dvh; display: flex; flex-direction: column; padding: 22px 14px 16px; border-right: 1px solid var(--line); background: var(--surface); }
  .brand { display: flex; align-items: center; gap: 10px; padding: 0 8px 22px; font-weight: 600; letter-spacing: -.02em; font-size: 16px; }
  .mark { width: 26px; height: 26px; border-radius: 8px; background: var(--accent); display: grid; place-items: center; color: var(--accent-ink); }
  .mark svg { width: 15px; height: 15px; stroke-width: 2; }
  nav { display: flex; flex-direction: column; gap: 2px; }
  nav button { display: flex; align-items: center; gap: 11px; width: 100%; padding: 9px 10px; border: 0; border-radius: 9px; background: none; color: var(--muted); font: 500 14.5px/1 inherit; cursor: pointer; transition: background .25s var(--ease), color .25s var(--ease), transform .15s var(--ease); }
  nav button:hover { color: var(--ink); background: var(--sunken); }
  nav button.on { color: var(--ink); background: var(--sunken); }
  nav button.on svg { color: var(--accent); }
  nav button:active { transform: scale(.98); }
  nav .badge { margin-left: auto; font-size: 11.5px; padding: 2px 7px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); }
  .side-foot { margin-top: auto; display: grid; gap: 10px; }
  .status { display: flex; align-items: center; gap: 9px; padding: 10px; border: 1px solid var(--line); border-radius: 11px; font-size: 13px; cursor: pointer; background: none; color: var(--ink); text-align: left; width: 100%; font-family: inherit; }
  .status small { display: block; color: var(--muted); font-size: 12px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex: none; }
  .dot.ok { background: var(--accent); animation: breathe 2.6s ease-in-out infinite; }
  .dot.bad { background: var(--bad); } .dot.warn { background: var(--warn); }
  @keyframes breathe { 0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 45%, transparent); } 50% { box-shadow: 0 0 0 5px transparent; } }
  main { padding: 34px clamp(18px, 4vw, 52px) 90px; max-width: 1400px; width: 100%; }

  .col { min-width: 0; }
  #alerts { padding: 0 clamp(18px, 4vw, 52px); max-width: 1400px; }
  .alert { display: flex; gap: 12px; align-items: flex-start; margin-top: 16px; padding: 12px 14px; border: 1px solid color-mix(in srgb, var(--bad) 35%, var(--line)); background: var(--bad-soft); border-radius: 12px; animation: rise .4s var(--ease) both; }
  .alert b { font-weight: 600; display: block; } .alert .meta { overflow-wrap: anywhere; }
  .alert svg { color: var(--bad); margin-top: 2px; }
  @media (max-width: 820px) { #alerts { padding: 0 16px; } }
  /* type */
  h1 { font-size: 26px; font-weight: 600; letter-spacing: -.03em; line-height: 1.15; margin: 0; }
  h2 { font-size: 13px; font-weight: 500; color: var(--muted); margin: 0; letter-spacing: .01em; }
  .lede { color: var(--muted); margin: 6px 0 0; max-width: 62ch; }
  .head { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 28px; }
  .head > div:first-child { flex: 1; min-width: 240px; }
  .meta { font-size: 13px; color: var(--muted); }
  .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .grow { flex: 1; min-width: 0; }
  .sec { display: flex; align-items: center; gap: 10px; margin: 26px 0 10px; }
  .sec .n { color: var(--faint); }

  /* controls */
  button { font-family: inherit; }
  .btn, .ghost, .quiet { display: inline-flex; align-items: center; gap: 7px; border-radius: 9px; padding: 8px 13px; font: 500 14px/1.2 inherit; cursor: pointer; transition: transform .15s var(--ease), background .25s var(--ease), border-color .25s var(--ease), opacity .2s; white-space: nowrap; }
  .btn { background: var(--accent); color: var(--accent-ink); border: 1px solid transparent; }
  .ghost { background: var(--surface); color: var(--ink); border: 1px solid var(--line); }
  .ghost:hover { border-color: var(--faint); }
  .quiet { background: none; color: var(--muted); border: 1px solid transparent; padding: 7px 9px; }
  .quiet:hover { color: var(--ink); background: var(--sunken); }
  .quiet.danger:hover { color: var(--bad); background: var(--bad-soft); }
  .btn:active, .ghost:active, .quiet:active { transform: scale(.97); }
  button:disabled { opacity: .5; cursor: default; }
  .btn svg, .ghost svg, .quiet svg { width: 16px; height: 16px; }
  textarea, input, select { width: 100%; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font: inherit; transition: border-color .2s, box-shadow .2s; }
  textarea:focus, input:focus, select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 16%, transparent); }
  textarea { min-height: 120px; resize: vertical; line-height: 1.55; }
  .field { display: grid; gap: 7px; margin-bottom: 18px; }
  .field label { font-size: 13px; font-weight: 500; }
  .field .help { font-size: 12.5px; color: var(--muted); }
  .auto { width: auto; }

  /* surfaces */
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); }
  .pad { padding: 18px; }
  .list { border-top: 1px solid var(--line); }
  .item { padding: 14px 2px; border-bottom: 1px solid var(--line); animation: rise .5s var(--ease) both; animation-delay: calc(var(--i, 0) * 45ms); }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } }
  .body { white-space: pre-wrap; overflow-wrap: anywhere; }
  .clamp { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .tag { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; padding: 2px 8px; border-radius: 99px; background: var(--sunken); color: var(--muted); }
  .tag.bad { background: var(--bad-soft); color: var(--bad); }
  .tag.ok { background: var(--accent-soft); color: var(--accent); }
  .err { color: var(--bad); font-size: 13px; margin: 6px 0 0; }
  .empty { padding: 26px 18px; border: 1px dashed var(--line); border-radius: 14px; color: var(--muted); text-align: left; }
  .empty b { display: block; color: var(--ink); font-weight: 500; margin-bottom: 3px; }
  .skel { border-radius: 10px; background: linear-gradient(100deg, var(--sunken) 30%, var(--line) 50%, var(--sunken) 70%); background-size: 220% 100%; animation: shimmer 1.3s linear infinite; }
  @keyframes shimmer { to { background-position: -220% 0; } }
  .stat-icons { display: flex; gap: 14px; align-items: center; }
  .stat-icons span { display: inline-flex; align-items: center; gap: 5px; }
  .stat-icons svg { width: 14px; height: 14px; }
  a { color: inherit; } a.quiet { text-decoration: none; }

  /* studio */
  .studio { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 34px; align-items: start; }
  .composer textarea { border: 0; padding: 4px 2px; min-height: 132px; box-shadow: none !important; background: none; font-size: 16px; }
  .composer .bar { display: flex; align-items: center; gap: 8px; padding-top: 12px; border-top: 1px solid var(--line); flex-wrap: wrap; }
  .draft { display: flex; gap: 10px; align-items: flex-start; padding: 13px 10px; margin: 0 -10px; border-radius: 12px; cursor: pointer; transition: background .2s; border-bottom: 1px solid var(--line); animation: rise .5s var(--ease) both; animation-delay: calc(var(--i, 0) * 45ms); }
  .draft:hover { background: var(--sunken); }
  .draft .grip { color: var(--faint); cursor: grab; padding-top: 2px; }
  .dragging { opacity: .4; }
  .week { position: sticky; top: 24px; }
  .week-head { display: flex; align-items: center; gap: 6px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .day { display: grid; grid-template-columns: 62px minmax(0, 1fr); gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
  .day:last-child { border-bottom: 0; }
  .day.today .dname { color: var(--accent); }
  .dname { font-size: 12px; font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; padding-top: 7px; }
  .dname b { display: block; font-size: 19px; color: var(--ink); letter-spacing: -.02em; font-weight: 600; text-transform: none; }
  .slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  .slot { min-height: 62px; border-radius: 11px; padding: 8px 10px; font-size: 13px; line-height: 1.4; transition: background .2s, border-color .2s, transform .2s var(--ease); }
  .slot .t { font-size: 11.5px; color: var(--muted); display: flex; align-items: center; gap: 5px; margin-bottom: 3px; }
  .slot.free { border: 1px dashed var(--line); color: var(--faint); cursor: pointer; background: none; text-align: left; width: 100%; font: inherit; font-size: 13px; }
  .slot.free:hover { border-color: var(--accent); color: var(--accent); }
  .slot.past { opacity: .45; pointer-events: none; }
  .slot.full { background: var(--accent-soft); border: 1px solid var(--accent-line); cursor: grab; }
  .slot.full .t { color: var(--accent); }
  .slot.full .x { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  .slot.over { border-style: solid; border-color: var(--accent); background: var(--accent-soft); transform: scale(1.02); }
  .dropzone.over { outline: 2px dashed var(--accent); outline-offset: 6px; border-radius: 12px; }

  /* dialog */
  dialog { border: 1px solid var(--line); border-radius: 18px; padding: 0; background: var(--surface); color: var(--ink); width: min(680px, calc(100vw - 24px)); max-height: calc(100dvh - 24px); box-shadow: 0 40px 80px -30px rgba(0, 0, 0, .45); }
  dialog::backdrop { background: rgba(10, 10, 12, .45); backdrop-filter: blur(3px); }
  dialog[open] { animation: pop .35s var(--ease); }
  @keyframes pop { from { opacity: 0; transform: translateY(12px) scale(.98); } }
  .dlg { padding: 20px; display: grid; gap: 14px; }
  .dlg textarea { min-height: 190px; font-size: 16px; }
  .variant { border: 1px solid var(--line); border-radius: 12px; padding: 12px; cursor: pointer; transition: border-color .2s, background .2s; animation: rise .45s var(--ease) both; animation-delay: calc(var(--i, 0) * 70ms); }
  .variant:hover { border-color: var(--accent); background: var(--accent-soft); }

  /* stats */
  .metrics { display: grid; grid-template-columns: 1.4fr repeat(4, 1fr); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); margin-bottom: 30px; }
  .metric { padding: 18px 18px 18px 0; } .metric + .metric { padding-left: 18px; border-left: 1px solid var(--line); }
  .metric b { display: block; font: 500 30px/1.1 "Geist Mono", monospace; letter-spacing: -.04em; }
  .metric:first-child b { font-size: 44px; color: var(--accent); }
  .charts { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 34px; margin-bottom: 30px; }
  .bars { display: flex; align-items: flex-end; gap: 4px; height: 130px; margin-top: 14px; }
  .bars div { flex: 1; background: var(--accent); border-radius: 4px 4px 0 0; min-height: 2px; transform-origin: bottom; animation: grow .7s var(--ease) both; animation-delay: calc(var(--i) * 18ms); }
  .bars div.z { background: var(--line); }
  @keyframes grow { from { transform: scaleY(0); } }
  .axis { display: flex; gap: 4px; font-size: 10.5px; color: var(--faint); margin-top: 5px; } .axis span { flex: 1; text-align: center; }

  /* voice */
  .chips { display: flex; flex-wrap: wrap; gap: 7px; }
  .chip { border: 1px solid var(--line); background: var(--surface); color: var(--muted); border-radius: 99px; padding: 6px 12px; font: 500 13.5px/1.2 inherit; cursor: pointer; transition: all .2s var(--ease); }
  .chip:hover { border-color: var(--faint); color: var(--ink); }
  .chip.on { background: var(--accent-soft); border-color: var(--accent-line); color: var(--accent); }
  .chip:active { transform: scale(.96); }
  .group { padding: 22px 0; border-top: 1px solid var(--line); }
  .group > h2 { color: var(--ink); font-size: 15px; font-weight: 600; margin-bottom: 4px; }
  .group > p { margin: 0 0 16px; color: var(--muted); font-size: 13.5px; max-width: 60ch; }
  .cols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 18px; }
  .sticky { position: sticky; top: 24px; }
  @media (max-width: 1020px) { .sticky { position: static; } }
  @media (max-width: 620px) { .cols { grid-template-columns: minmax(0, 1fr); } }

  /* materials + switches */
  .reader { max-width: 72ch; line-height: 1.7; overflow-wrap: anywhere; }
  .reader h3 { font-size: 20px; letter-spacing: -.02em; margin: 26px 0 8px; } .reader h4 { font-size: 16px; margin: 20px 0 6px; }
  .reader p { margin: 0 0 12px; } .reader ul { margin: 0 0 12px; padding-left: 20px; } .reader code { font: 13px "Geist Mono", monospace; background: var(--sunken); padding: 1px 5px; border-radius: 5px; }
  .mat { padding: 12px 10px; margin: 0 -10px; border-radius: 11px; cursor: pointer; border-bottom: 1px solid var(--line); transition: background .2s; }
  .mat:hover, .mat.on { background: var(--sunken); }
  .switch { display: flex; gap: 12px; align-items: flex-start; padding: 14px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
  .switch input { appearance: none; width: 38px; height: 22px; border-radius: 99px; background: var(--line); border: 0; padding: 0; position: relative; flex: none; cursor: pointer; transition: background .25s var(--ease); margin-top: 2px; }
  .switch input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--surface); transition: transform .25s var(--ease); box-shadow: 0 1px 2px rgba(0,0,0,.25); }
  .switch input:checked { background: var(--accent); } .switch input:checked::after { transform: translateX(16px); }
  .switch input:focus { box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 16%, transparent); }
  .switch b { font-weight: 500; display: block; } .switch span { font-size: 13px; color: var(--muted); }

  .side { display: inline-flex; padding: 4px; background: var(--sunken); border-radius: 14px; gap: 2px; border: 1px solid var(--line); }
  .side button { border: 0; background: none; padding: 10px 22px; border-radius: 10px; font: 600 15px/1 inherit; color: var(--muted); cursor: pointer; transition: all .3s var(--ease); display: inline-flex; gap: 8px; align-items: center; }
  .side button.on { background: var(--accent); color: var(--accent-ink); }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(104px, 1fr)); gap: 10px 16px; }
  .kpis b { display: block; font: 500 18px/1.2 "Geist Mono", monospace; letter-spacing: -.02em; } .kpis span { font-size: 12px; color: var(--muted); }
  .creator { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 16px; align-items: start; }
  @media (max-width: 820px) { .creator { grid-template-columns: 44px minmax(0, 1fr); } .creator > :nth-child(3) { grid-column: 2; } }
  /* people */
  .person { display: grid; grid-template-columns: 44px minmax(0, 1.3fr) minmax(0, 2fr) auto; gap: 16px; align-items: start; }
  .avatar { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; background: var(--sunken); display: grid; place-items: center; font-weight: 600; color: var(--muted); }
  .subs { display: flex; flex-wrap: wrap; gap: 5px; }
  .spark { width: 100%; height: 56px; display: block; }
  .spark path { fill: none; stroke: var(--accent); stroke-width: 2; vector-effect: non-scaling-stroke; }
  .trend { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 34px; margin-bottom: 34px; }
  pre.report { font: 12px/1.5 "Geist Mono", monospace; white-space: pre-wrap; overflow-wrap: anywhere; margin: 0; }
  @media (max-width: 820px) { .person { grid-template-columns: 44px minmax(0, 1fr); } .person > :nth-child(n+3) { grid-column: 2; } .trend { grid-template-columns: minmax(0, 1fr); gap: 20px; } }

  /* misc */
  .tabs { max-width: 100%; overflow-x: auto; display: inline-flex; padding: 3px; background: var(--sunken); border-radius: 11px; gap: 2px; }
  .tabs button { white-space: nowrap; border: 0; background: none; padding: 7px 14px; border-radius: 8px; font: 500 14px/1 inherit; color: var(--muted); cursor: pointer; transition: all .25s var(--ease); }
  .tabs button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0, 0, 0, .08); }
  .two { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 34px; align-items: start; }
  .focus { background: var(--sunken); box-shadow: inset 3px 0 0 var(--accent); padding-left: 14px; border-radius: 0 10px 10px 0; }
  kbd { font: 500 11.5px "Geist Mono", monospace; background: var(--sunken); border: 1px solid var(--line); border-radius: 5px; padding: 1px 5px; }
  #toast { position: fixed; bottom: 24px; left: 50%; translate: -50% 0; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 11px; font-size: 14px; max-width: 90vw; opacity: 0; transform: translateY(10px); transition: all .35s var(--ease); pointer-events: none; z-index: 20; }
  #toast.show { opacity: 1; transform: none; }
  #login { min-height: 100dvh; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  #login .l { padding: clamp(28px, 7vw, 96px); display: flex; flex-direction: column; justify-content: center; max-width: 520px; }
  #login .r { background: var(--sunken); border-left: 1px solid var(--line); display: grid; place-items: center; padding: 40px; }
  .mock { width: min(360px, 100%); display: grid; gap: 10px; }
  .mock .slot { animation: float 5s ease-in-out infinite; animation-delay: calc(var(--i) * -1.3s); }
  @keyframes float { 50% { transform: translateY(-5px); } }

  @media (max-width: 1020px) { .studio, .two, .charts { grid-template-columns: minmax(0, 1fr); } .week { position: static; } }
  @media (max-width: 820px) {
    #app { grid-template-columns: minmax(0, 1fr); }
    aside { position: fixed; inset: auto 0 0 0; height: auto; flex-direction: row; padding: 6px 6px calc(6px + env(safe-area-inset-bottom)); border-right: 0; border-top: 1px solid var(--line); z-index: 10; }
    .brand, .side-foot { display: none; }
    nav { flex-direction: row; width: 100%; justify-content: space-between; overflow-x: auto; }
    nav button { flex-direction: column; gap: 4px; font-size: 10px; padding: 7px 5px; width: auto; flex: 1 0 auto; min-width: 52px; }
    nav .badge { position: absolute; margin: -4px 0 0 22px; }
    main { padding: 22px 16px 110px; }
    #toast { bottom: calc(84px + env(safe-area-inset-bottom)); }
    .metrics { grid-template-columns: 1fr 1fr; } .metric + .metric { border-left: 0; padding-left: 0; } .metric:first-child { grid-column: 1 / -1; }
    #login { grid-template-columns: minmax(0, 1fr); } #login .r { display: none; }
    .day { grid-template-columns: 48px minmax(0, 1fr); padding: 10px; }
  }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>

  <symbol id="i-studio" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></symbol>
  <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3.5l1.9 5.1 5.1 1.9-5.1 1.9L12 17.5l-1.9-5.1L5 10.5l5.1-1.9zM18.5 16l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8z"/></symbol>

<dialog id="editor"></dialog>
<div id="toast"></div>

<script>
// ---------- language ----------
// Italian is the source. Other languages are dictionaries keyed by the Italian text; numbers are matched as "#".
const LOCALES = { it: "it-IT", en: "en-GB", de: "de-DE", es: "es-ES", ru: "ru-RU", fr: "fr-FR", hi: "hi-IN", pt: "pt-BR" };
const LANG_NAMES = { it: "Italiano", en: "English", de: "Deutsch", es: "Español", ru: "Русский", fr: "Français", hi: "हिन्दी", pt: "Português (Brasil)" };
let LANG = "it", DICT = null;
try { LANG = localStorage.getItem("lang") || "it"; } catch {}
// A translation may hold several forms separated by " ||| ", one per plural category of the language
// (in the order Intl.PluralRules lists them, e.g. one ||| other, or one ||| few ||| many ||| other).
function plural(t, num) {
  if (!t.includes(" ||| ")) return t;
  const forms = t.split(" ||| "), rules = new Intl.PluralRules(LOCALES[LANG]), cats = rules.resolvedOptions().pluralCategories;
  const i = cats.indexOf(rules.select(Number(String(num).replace(",", "."))));
  return forms[i >= 0 && i < forms.length ? i : forms.length - 1];
}
function tr(text) {
  if (!DICT || !text) return text;
  const core = text.trim(); if (!core) return text;
  let out = DICT[core];
  if (out === undefined) {
    const nums = []; const key = core.replace(/\d+(?:[.,]\d+)?/g, (m) => { nums.push(m); return "#"; });
    const t = nums.length ? DICT[key] : undefined;
    if (t !== undefined) { let i = 0; out = plural(t, nums[0]).replace(/#/g, () => nums[i++] ?? ""); }
  }
  return out === undefined ? text : text.replace(core, out);
}
const NT = "[data-nt], .body, .x, .reader, .variant, textarea, pre, script, style";
function translateTree(root) {
  if (!DICT || !root) return;
  if (root.nodeType === 3) { if (!root.parentElement?.closest(NT)) { const t = tr(root.nodeValue); if (t !== root.nodeValue) root.nodeValue = t; } return; }
  if (root.nodeType !== 1 || root.closest(NT)) return;
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT | NodeFilter.SHOW_ELEMENT, { acceptNode: (n) => n.nodeType === 1 && n.matches(NT) ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT });
  for (let n = root; n; n = w.nextNode()) {
    if (n.nodeType === 3) { const t = tr(n.nodeValue); if (t !== n.nodeValue) n.nodeValue = t; }
    else for (const a of ["placeholder", "title", "aria-label"]) if (n.hasAttribute?.(a)) { const v = n.getAttribute(a), t = tr(v); if (t !== v) n.setAttribute(a, t); }
  }
}
async function setLang(l) {
  LANG = l in LOCALES ? l : "it"; DICT = null; try { localStorage.setItem("lang", LANG); } catch {}
  document.documentElement.lang = LOCALES[LANG].slice(0, 2);
  try { DICT = await (await fetch("/i18n/" + LANG)).json(); } catch { DICT = null; }
  translateTree(document.body);
}
new MutationObserver((ms) => { for (const m of ms) { if (m.type === "characterData") translateTree(m.target); else m.addedNodes.forEach(translateTree); } })
  .observe(document.documentElement, { childList: true, subtree: true, characterData: true });
const _confirm = window.confirm.bind(window); window.confirm = (m) => _confirm(tr(m));

const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const icon = (n) => `<svg class="i"><use href="#i-${n}"/></svg>`;
let TZ = "Europe/Rome";
const fmt = (ms, o) => ms ? new Date(ms).toLocaleString(LOCALES[LANG], { timeZone: TZ, ...(o || { weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }) }) : "";
const nt = (x) => `<span data-nt>${esc(x)}</span>`;
const F = (ms, o) => nt(fmt(ms, o));
const hm = (ms) => fmt(ms, { hour: "2-digit", minute: "2-digit" });
const toLocalInput = (ms) => { const d = new Date(ms - new Date(ms).getTimezoneOffset() * 60000); return d.toISOString().slice(0, 16); };
const skel = (n, h = 64) => Array.from({ length: n }, () => `<div class="skel" style="height:${h}px;margin-bottom:10px"></div>`).join("");
const empty = (title, text) => `<div class="empty"><b>${title}</b>${text}</div>`;
const counts = (n) => `<div class="stat-icons meta mono"><span>${icon("heart")}${n.likes}</span><span>${icon("repeat")}${n.restacks}</span><span>${icon("chat")}${n.replies}</span></div>`;

let toastTimer;
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 4200); }

async function api(path, method = "GET", body) {
  const res = await fetch("/api" + path, { method, headers: body ? { "Content-Type": "application/json" } : {}, body: body ? JSON.stringify(body) : undefined });
  if (res.status === 401 && path !== "/login") { showLogin(); throw new Error("Sessione scaduta"); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || "Errore " + res.status);
  return data;
}
// Runs an action with the button disabled; errors surface as a toast.
async function act(btn, fn) {
  if (btn) btn.disabled = true;
  try { return await fn(); } catch (e) { toast(e.message); } finally { if (btn) btn.disabled = false; }
}

// ---------- shell ----------
const ALL_TABS = { studio: ["Studio", "studio"], generate: ["Genera", "spark"], voice: ["Voce", "pen"], materials: ["Materiali", "book"], stats: ["Statistiche", "chart"], activity: ["Attività", "chat"], people: ["Persone", "users"], feed: ["Feed", "bookmark"], settings: ["Impostazioni", "gear"] };
let settings = null;
// The two draft-writing sections appear only when the owner has switched draft writing on.
const tabs = () => Object.fromEntries(Object.entries(ALL_TABS).filter(([k]) => settings?.ai_drafts || (k !== "generate" && k !== "voice")));
let tab = location.hash.slice(1) in ALL_TABS ? location.hash.slice(1) : "studio";

function showLogin() { $("#app").classList.add("hidden"); $("#login").classList.remove("hidden"); }
function go(t) { tab = t; history.replaceState(null, "", "#" + t); drawNav(); render(); }
function drawNav(badges = {}) {
  if (!(tab in tabs())) tab = "studio";
  $("#nav").innerHTML = Object.entries(tabs()).map(([k, [label, ic]]) =>
    `<button data-tab="${k}" class="${k === tab ? "on" : ""}">${icon(ic)}<span>${label}</span>${badges[k] ? `<span class="badge mono">${badges[k]}</span>` : ""}</button>`).join("");
}
function drawStatus() {
  const s = settings; if (!s) return;
  const [cls, text, sub] = s.paused ? ["warn", "In pausa", "Nessuna azione automatica"] : !s.handle ? ["warn", "Da configurare", "Imposta il tuo handle"]
    : !s.has_cookie ? ["warn", "Cookie mancante", "Sola lettura"]
    : s.cookie_ok === false ? ["bad", "Collegamento interrotto", "Reinserisci il cookie"]
    : s.cookie_ok === true ? ["ok", "Collegato", "@" + s.handle]
    : ["", "Da verificare", "@" + s.handle];
  $("#status .dot").className = "dot " + cls; $("#statusText").textContent = text; $("#statusSub").textContent = sub; $("#statusSub").toggleAttribute("data-nt", sub.startsWith("@"));
}
async function boot() {
  settings = await api("/settings"); TZ = settings.timezone;
  if (settings.language !== LANG) await setLang(settings.language);
  $("#login").classList.add("hidden"); $("#app").classList.remove("hidden");
  drawNav(); drawStatus(); render();
  api("/activity").then((a) => drawNav({ activity: a.length || 0 })).catch(() => {});
}
$("#nav").onclick = (e) => { const b = e.target.closest("[data-tab]"); if (b) go(b.dataset.tab); };
$("#status").onclick = () => go("settings");
$("#loginForm").onsubmit = async (e) => {
  e.preventDefault(); $("#loginErr").textContent = "";
  try { await api("/login", "POST", { password: $("#pw").value }); $("#pw").value = ""; boot(); } catch (err) { $("#loginErr").textContent = err.message; }
};
$("#logout").onclick = async () => { await api("/logout", "POST"); showLogin(); };

// Problems raised by the server stay on top of every screen until acknowledged.
async function drawAlerts() {
  let list = []; try { list = await api("/alerts"); } catch { return; }
  $("#alerts").innerHTML = list.map((a) => `<div class="alert" data-id="${a.id}">${icon("x")}<div class="grow"><b>${esc(a.title)}</b><div class="meta" ${a.kind === "cookie" ? "" : "data-nt"}>${esc(a.detail || "")}</div><div class="meta">${F(a.at)}</div></div><button class="ghost" data-seen>Ho visto</button></div>`).join("");
}
$("#alerts").onclick = (e) => { const b = e.target.closest("[data-seen]"); if (b) act(b, async () => { await api("/alerts/seen", "POST", { id: +b.closest(".alert").dataset.id }); drawAlerts(); }); };
setInterval(() => { if (!$("#app").classList.contains("hidden") && !document.hidden) drawAlerts(); }, 120000);

const views = {};
async function render() {
  const v = $("#view"); v.onclick = v.onkeydown = v.onchange = v.oninput = null; document.onkeydown = null;
  v.innerHTML = `<div class="skel" style="height:34px;width:220px;margin-bottom:26px"></div>${skel(4)}`;
  drawAlerts();
  try { await views[tab](v); } catch (e) { if (e.message !== "Sessione scaduta") v.innerHTML = `<p class="err">${esc(e.message)}</p>`; }
}

// ---------- Studio ----------
let weekOffset = 0;
views.studio = async (v) => {
  const [notes, week] = await Promise.all([api("/notes"), api("/week?offset=" + weekOffset)]);
  const by = (s) => notes.filter((n) => n.status === s);
  const drafts = by("draft"), sched = by("scheduled"), stuck = [...by("failed"), ...by("publishing")], pub = by("published");
  const slotOf = new Map(sched.map((n) => [n.scheduled_at, n]));
  const first = week.days[0], last = week.days[6];
  const range = `${F(first.start, { day: "numeric", month: "short" })} – ${F(last.start, { day: "numeric", month: "short" })}`;

  const dayHtml = (d, i) => {
    const used = new Set();
    const cells = d.slots.map((s) => {
      const n = slotOf.get(s.ts);
      if (n) { used.add(n.id); return `<div class="slot full" draggable="true" data-id="${n.id}" data-ts="${s.ts}"><div class="t mono">${icon("clock")}${s.label}${n.native_id ? `<span class="tag ok" style="margin-left:auto;font-family:Geist,sans-serif">affidata a Substack</span>` : ""}</div><div class="x">${esc(n.body)}</div></div>`; }
      return `<button class="slot free ${s.ts < week.now ? "past" : ""}" data-ts="${s.ts}"><div class="t mono">${s.label}</div>Libero</button>`;
    });
    // Notes scheduled outside the configured slots still show on their day.
    const extra = sched.filter((n) => n.scheduled_at >= d.start && n.scheduled_at < d.end && !used.has(n.id))
      .map((n) => `<div class="slot full" draggable="true" data-id="${n.id}"><div class="t mono">${icon("clock")}${hm(n.scheduled_at)}${n.native_id ? `<span class="tag ok" style="margin-left:auto;font-family:Geist,sans-serif">affidata a Substack</span>` : ""}</div><div class="x">${esc(n.body)}</div></div>`);
    return `<div class="day ${weekOffset === 0 && i === 0 ? "today" : ""}">
      <div class="dname">${F(d.start, { weekday: "short" })}<b class="mono">${F(d.start, { day: "numeric" })}</b></div>
      <div class="slots">${cells.join("")}${extra.join("")}${d.end > week.now ? `<button class="slot free" data-day="${d.start}" style="min-height:0;display:flex;align-items:center;gap:6px">${icon("plus")}<span>Altro orario</span></button>` : ""}</div></div>`;
  };
  const draftHtml = (n, i) => `<div class="draft" ${n.reviewed ? 'draggable="true"' : ""} data-id="${n.id}" style="--i:${i}">
      <span class="grip" title="${n.reviewed ? "Trascina su uno slot" : "Da approvare prima di programmare"}" ${n.reviewed ? "" : 'style="cursor:default;color:var(--accent)"'}>${icon(n.reviewed ? "grip" : "spark")}</span>
      <div class="grow"><div class="body clamp">${esc(n.body)}</div>
        <div class="row meta" style="margin-top:6px">${n.status === "failed" ? '<span class="tag bad">Errore</span>' : ""}${n.status === "publishing" ? '<span class="tag bad">Bloccata</span>' : ""}${!n.reviewed ? `<span class="tag ok">${n.source === "chat" ? "Nata in chat · da approvare" : "Spunto di Claude · da approvare"}</span>` : n.source === "generated" ? `<span class="tag">nata da uno spunto</span>` : n.source === "chat" ? `<span class="tag">nata in chat</span>` : ""}<span class="mono">${n.body.length}</span></div>
        ${n.error ? `<p class="err">${esc(n.error)}</p>` : ""}</div></div>`;

  v.innerHTML = `
    <div class="head"><div><h1>Studio</h1><p class="lede">Scrivi a sinistra, pianifica a destra. Trascina una bozza su uno slot libero, oppure clicca lo slot per scriverci dentro.</p></div></div>
    <div class="studio">
      <section>
        <div class="panel pad composer">
          <textarea id="newBody" placeholder="A cosa stai pensando? Per importarne più d'una, separale con una riga che contiene solo ---"></textarea>
          <div class="bar"><span class="meta mono" id="count">0</span><span class="grow"></span>
            <button class="quiet" id="addDraft">Salva bozza</button><button class="ghost" id="addNow">${icon("send")}Pubblica ora</button>
            <button class="ghost" id="addWhen">${icon("studio")}Scegli data e ora</button><button class="btn" id="addQueue">${icon("clock")}Prossimo slot</button></div>
        </div>
        ${stuck.length ? `<div class="sec"><h2>Da controllare</h2><span class="n mono">${stuck.length}</span></div><div>${stuck.map(draftHtml).join("")}</div>` : ""}
        <div class="sec"><h2>Bozze</h2><span class="n mono">${drafts.length}</span><span class="grow"></span>${drafts.length ? `<button class="quiet" id="schedAll">${icon("clock")}Programma tutte</button>` : ""}</div>
        <div class="dropzone" id="draftZone">${drafts.map(draftHtml).join("") || empty("Nessuna bozza", "Scrivi qui sopra. Trascinando qui una Note programmata, torna bozza.")}</div>
        ${pub.length ? `<div class="sec"><h2>Pubblicate da qui</h2><span class="n mono">${pub.length}</span></div><div class="list">${pub.slice(0, 12).map((n, i) => `<div class="item" style="--i:${i}"><div class="body clamp">${esc(n.body)}</div><div class="meta" style="margin-top:5px">${F(n.published_at)}</div></div>`).join("")}</div>` : ""}
      </section>
      <section class="panel week">
        <div class="week-head"><h2 class="grow" style="color:var(--ink);font-size:14.5px">${range}</h2>
          <span class="meta mono" style="margin-right:6px">${sched.length} in coda</span>
          <button class="quiet" id="wPrev" title="Settimana precedente" ${weekOffset <= 0 ? "disabled" : ""}>${icon("left")}</button>
          <button class="quiet" id="wNow" ${weekOffset === 0 ? "disabled" : ""}>Oggi</button>
          <button class="quiet" id="wNext" title="Settimana successiva">${icon("right")}</button></div>
        ${week.days.map(dayHtml).join("")}
        ${week.has_slots ? "" : `<div class="pad meta">Nessun orario ricorrente impostato: puoi comunque scegliere un orario qualsiasi, o definire i tuoi nelle Impostazioni.</div>`}
      </section>
    </div>`;

  const nb = $("#newBody"); nb.oninput = () => ($("#count").textContent = nb.value.length);
  const add = (queue) => (e) => act(e.currentTarget, async () => {
    const bodies = nb.value.split(/\n\s*---\s*\n/).map((s) => s.trim()).filter(Boolean);
    if (!bodies.length) throw new Error("Scrivi qualcosa prima");
    await api("/notes", "POST", { bodies });
    if (queue) await api("/notes/schedule", "POST", {});
    toast(bodies.length === 1 ? (queue ? "Note in coda" : "Bozza salvata") : (queue ? `${bodies.length} Notes in coda` : `${bodies.length} Notes salvate`)); render();
  });
  $("#addDraft").onclick = add(false); $("#addQueue").onclick = add(true);
  $("#addWhen").onclick = () => { if (!nb.value.trim()) return toast("Scrivi qualcosa prima"); openEditor({ body: nb.value.trim(), scheduled_at: null, pick: true }); };
  $("#addNow").onclick = (e) => act(e.currentTarget, async () => {
    const text = nb.value.trim(); if (!text) throw new Error("Scrivi qualcosa prima");
    if (!confirm("Pubblicare subito su Substack?")) return;
    const r = await api("/notes", "POST", { body: text });
    try { await api(`/notes/${r.ids[0]}/publish`, "POST"); toast("Pubblicata su Substack"); } finally { render(); }
  });
  if ($("#schedAll")) $("#schedAll").onclick = (e) => act(e.currentTarget, async () => { const r = await api("/notes/schedule", "POST", {}); toast(`${r.scheduled} Notes programmate`); render(); });
  $("#wPrev").onclick = () => { weekOffset--; render(); }; $("#wNext").onclick = () => { weekOffset++; render(); }; $("#wNow").onclick = () => { weekOffset = 0; render(); };

  v.onclick = (e) => {
    const free = e.target.closest(".slot.free");
    if (free) {
      if (free.dataset.ts) return openEditor({ scheduled_at: +free.dataset.ts, body: "" });
      // "Another time" on a day: propose the next full hour today, or noon on a later day.
      const start = +free.dataset.day, t = start < week.now ? Math.ceil((week.now + 10 * 60000) / 3600000) * 3600000 : start + 12 * 3600000;
      return openEditor({ scheduled_at: t, body: "", pick: true });
    }
    const el = e.target.closest("[data-id]"); if (el) openEditor(notes.find((n) => n.id == el.dataset.id));
  };
  // Drag a note onto a free slot to schedule it, or back onto the drafts to unschedule it.
  let dragId = null;
  v.addEventListener("dragstart", (e) => { const el = e.target.closest("[draggable]"); if (!el) return; dragId = el.dataset.id; el.classList.add("dragging"); e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", dragId); });
  v.addEventListener("dragend", () => { $$(".dragging, .over", v).forEach((x) => x.classList.remove("dragging", "over")); dragId = null; });
  const target = (e) => e.target.closest(".slot.free:not(.past), #draftZone");
  v.addEventListener("dragover", (e) => { const t = target(e); if (!t || !dragId) return; e.preventDefault(); $$(".over", v).forEach((x) => x !== t && x.classList.remove("over")); t.classList.add("over"); });
  v.addEventListener("dragleave", (e) => { const t = target(e); if (t && !t.contains(e.relatedTarget)) t.classList.remove("over"); });
  v.addEventListener("drop", (e) => {
    const t = target(e); if (!t || !dragId) return; e.preventDefault(); const id = dragId;
    act(null, async () => { await api("/notes/" + id, "PUT", { scheduled_at: t.id === "draftZone" ? null : +t.dataset.ts }); render(); });
  });
};

    <textarea id="eBody" ${locked ? "readonly" : ""} placeholder="Scrivi la Note…">${esc(n.body)}</textarea>
    <div class="row"><span class="meta mono" id="eCount">${n.body.length}</span><span class="grow"></span>

    <div id="eVariants" style="display:grid;gap:8px"></div>
    <div class="field" style="margin:0"><label for="eWhen">Data e ora di pubblicazione</label>
      <input type="datetime-local" id="eWhen" value="${n.scheduled_at ? toLocalInput(n.scheduled_at) : ""}"><span class="help">Qualsiasi giorno e ora, anche fuori dagli orari ricorrenti. Nell'orario di questo dispositivo. Lascia vuoto per tenerla tra le bozze.</span></div>
    <div class="row">
      ${n.id && !n.reviewed ? `<button type="button" class="ghost" id="eApprove">${icon("check")}Approva così com'è</button>` : ""}
      ${isNew ? "" : `<button type="button" class="quiet danger" id="eDel">${icon("trash")}Elimina</button><button type="button" class="quiet" id="eNow">${icon("send")}Pubblica ora</button>`}
      <span class="grow"></span><button class="ghost" value="close">Annulla</button><button type="button" class="btn" id="eSave">${icon("check")}Salva</button></div>
  </form>`;
  const body = $("#eBody", d); body.oninput = () => ($("#eCount", d).textContent = body.value.length);
  const close = () => { d.close(); render(); };
  $$("[data-mode]", d).forEach((b) => (b.onclick = () => act(b, async () => {
    if (!body.value.trim()) throw new Error("Scrivi prima una bozza da riscrivere");
    $("#eVariants", d).innerHTML = skel(3, 58);
    try {
      const r = await api("/rewrite", "POST", { body: body.value, mode: b.dataset.mode });
      $("#eVariants", d).innerHTML = `<span class="meta">Clicca una versione per usarla. L'originale resta finché non salvi.</span>` + r.variants.map((x, i) => `<div class="variant body" style="--i:${i}">${esc(x)}</div>`).join("");
      $$(".variant", d).forEach((el, i) => (el.onclick = () => { body.value = r.variants[i]; body.oninput(); $("#eVariants", d).innerHTML = ""; }));
    } catch (e) { $("#eVariants", d).innerHTML = ""; throw e; }
  })));
  $("#eSave", d).onclick = (e) => act(e.currentTarget, async () => {
    const text = body.value.trim(); if (!text) throw new Error("Testo vuoto");
    const when = $("#eWhen", d).value ? new Date($("#eWhen", d).value).getTime() : null;
    if (when && when < Date.now()) throw new Error("La data è nel passato");
    if (isNew) await api("/notes", "POST", { body: text, scheduled_at: when || undefined });
    else {
      // Save the text first, so a refusal to schedule an unrewritten suggestion never loses the edit.
      const r = await api("/notes/" + n.id, "PUT", { body: text });
      if (when && !r.reviewed) { toast("Salvata. Per programmarla, approvala o riscrivila di più"); return close(); }
      if (when !== n.scheduled_at) await api("/notes/" + n.id, "PUT", { scheduled_at: when });
    }
    toast(when ? tr("Programmata per") + " " + fmt(when) : "Bozza salvata"); close();
  });
  if ($("#eApprove", d)) $("#eApprove", d).onclick = (e) => act(e.currentTarget, async () => {
    await api("/notes/" + n.id, "PUT", { body: body.value.trim() || n.body, approve: true }); toast("Approvata: ora puoi programmarla"); close();
  });
  if (!isNew) {
    $("#eDel", d).onclick = (e) => act(e.currentTarget, async () => { if (!confirm("Eliminare questa Note?")) return; await api("/notes/" + n.id, "DELETE"); close(); });
    $("#eNow", d).onclick = (e) => act(e.currentTarget, async () => {
      if (!confirm("Pubblicare subito su Substack?")) return;
      if (body.value.trim() !== n.body) await api("/notes/" + n.id, "PUT", { body: body.value.trim() });
      try { await api(`/notes/${n.id}/publish`, "POST"); toast("Pubblicata su Substack"); } finally { close(); }
    });
  }
  d.showModal();
  if (n.pick) { const w = $("#eWhen", d); if (!w.value) w.value = toLocalInput(Math.ceil((Date.now() + 10 * 60000) / 3600000) * 3600000); w.focus(); }
}

// Minimal, safe Markdown: everything is escaped first, then a few block and inline marks are restored.
function md(text) {
  const inline = (t) => esc(t).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>");
  const out = []; let list = false;
  for (const raw of text.replace(/\r/g, "").replace(/\\([#*_.\-`])/g, "$1").split("\n")) {
    const line = raw.trim(), li = line.match(/^[-*]\s+(.*)/) || line.match(/^\d+\.\s+(.*)/);
    if (li) { if (!list) { out.push("<ul>"); list = true; } out.push(`<li>${inline(li[1])}</li>`); continue; }
    if (list) { out.push("</ul>"); list = false; }
    const h = line.match(/^(#{1,4})\s+(.*)/);
    if (h) out.push(h[1].length <= 2 ? `<h3>${inline(h[2])}</h3>` : `<h4>${inline(h[2])}</h4>`); else if (line) out.push(`<p>${inline(line)}</p>`);
  }
  if (list) out.push("</ul>");
  return out.join("");
}

// ---------- Statistiche ----------
let statDays = 90;
const spark = (vals) => {
  const max = Math.max(...vals), min = Math.min(...vals), span = max - min || 1;
  return `<svg class="spark" viewBox="0 0 100 40" preserveAspectRatio="none"><path d="${vals.map((x, i) => `${i ? "L" : "M"}${(i / (vals.length - 1)) * 100} ${37 - ((x - min) / span) * 34}`).join(" ")}"/></svg>`;
};
views.stats = async (v) => {
  const [d, trend] = await Promise.all([api("/stats?days=" + statDays), api("/trend")]);
  const tcard = (label, key) => {
    const vals = trend.map((t) => t[key] ?? 0), lastV = vals[vals.length - 1], diff = lastV - vals[0];
    return `<div><h2>${label}</h2><div class="row" style="align-items:baseline;margin-top:6px"><b class="mono" style="font-size:26px;font-weight:500">${lastV}</b><span class="meta mono">${diff >= 0 ? "+" : ""}${diff} in ${trend.length} giorni</span></div>${spark(vals)}</div>`;
  };
  const trendHtml = trend.length >= 2 ? `<div class="trend">${tcard("Follower", "followers")}${tcard("Like totali", "likes")}${tcard("Risposte totali", "replies")}</div>`
    : `<div style="margin-bottom:30px">${empty("L'andamento si sta formando", `Da oggi l'app salva un'istantanea al giorno dei tuoi numeri${trend[0] ? ` (follower oggi: ${trend[0].followers ?? "n.d."}, iscritti: ${trend[0].subscribers ?? "n.d."})` : ""}. Il grafico compare dal secondo giorno.`)}</div>`;
  const bars = (rows, keys, label) => {
    const map = new Map(rows.map((r) => [String(r.key), r])); const max = Math.max(1, ...rows.map((r) => r.avg));
    return `<div class="bars">${keys.map((k, i) => { const r = map.get(String(k)); return `<div class="${r ? "" : "z"}" style="--i:${i};height:${r ? Math.max(4, (r.avg / max) * 100) : 2}%" title="${label(k)}: media ${r ? r.avg : 0} su ${r ? r.count : 0} Notes"></div>`; }).join("")}</div><div class="axis mono">${keys.map((k) => `<span>${label(k)}</span>`).join("")}</div>`;
  };
  const wd = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"], wdIt = { Mon: "Lun", Tue: "Mar", Wed: "Mer", Thu: "Gio", Fri: "Ven", Sat: "Sab", Sun: "Dom" };
  const avg = d.total ? ((d.likes + d.restacks + d.replies) / d.total).toFixed(1) : "0";
  v.innerHTML = `
    <div class="head"><div><h1>Statistiche</h1><p class="lede">Interazioni pubbliche delle tue Notes. ${d.last_sync ? `<span>Aggiornate</span> ${F(d.last_sync)}.` : "Mai sincronizzate."}</p></div>
      <select id="days" class="auto">${[30, 90, 365, 3650].map((x) => `<option value="${x}" ${x === statDays ? "selected" : ""}>${x === 3650 ? "Da sempre" : "Ultimi " + x + " giorni"}</option>`).join("")}</select>
      <button class="ghost" id="syncNow">${icon("repeat")}Aggiorna i miei dati</button><button class="quiet" id="syncDeep" title="Scarica anche le Notes più vecchie">Importa storico</button></div>
    ${trendHtml}
    ${d.brought.measured ? `<div class="sec" style="margin-top:0"><h2>Cosa hanno portato le tue Notes</h2><span class="n mono">${d.brought.measured} misurate</span></div>
    <div class="metrics" style="grid-template-columns:repeat(4,1fr)">
      <div class="metric"><b style="font-size:30px;color:var(--accent)">${d.brought.free_subs}</b><span class="meta">iscritti gratuiti</span></div>
      <div class="metric"><b>${d.brought.paid_subs}</b><span class="meta">iscritti a pagamento</span></div>
      <div class="metric"><b>${d.brought.follows}</b><span class="meta">nuovi follower</span></div>
      <div class="metric"><b>${d.brought.clicks}</b><span class="meta">clic sui link</span></div>
    </div>
    ${d.by_result.length ? `<div class="list" style="margin:-14px 0 30px">${d.by_result.map((n, i) => `<div class="item" style="--i:${i}"><div class="body clamp">${esc(n.body)}</div><div class="row meta mono" style="margin-top:6px;gap:14px"><span>${n.free_subs} gratuiti</span><span>${n.paid_subs} a pagamento</span><span>${n.follows} follower</span><span>${n.clicks} clic</span><span>${F(n.date, { day: "numeric", month: "short" })}</span></div></div>`).join("")}</div>` : ""}` : ""}
    <div id="sources" style="margin-bottom:30px"></div>
    ${d.total ? `
    <div class="metrics">
      <div class="metric"><b>${avg}</b><span class="meta">interazioni medie per Note</span></div>
      <div class="metric"><b>${d.total}</b><span class="meta">Notes</span></div><div class="metric"><b>${d.likes}</b><span class="meta">like</span></div>
      <div class="metric"><b>${d.restacks}</b><span class="meta">restack</span></div><div class="metric"><b>${d.replies}</b><span class="meta">risposte</span></div>
    </div>
    <div class="charts">
      <div><h2>Interazioni medie per ora di pubblicazione</h2>${bars(d.by_hour, [...Array(24).keys()], (k) => k)}<p class="meta" style="margin-top:10px">Le ore con poche Notes sono poco affidabili: passa sopra una barra per vedere su quante si basa.</p></div>
      <div><h2>Per giorno della settimana</h2>${bars(d.by_weekday, wd, (k) => wdIt[k])}
        <div class="list" style="margin-top:22px">${d.by_length.map((r) => `<div class="item row" style="padding:9px 2px"><span class="grow">${esc(r.key)}</span><span class="meta mono">${r.count}</span><span class="mono" style="width:54px;text-align:right">${r.avg}</span></div>`).join("")}</div></div>
    </div>
    <div class="sec"><h2>Le tue Notes migliori</h2></div>
    <div class="list">${d.top.map((n, i) => `<div class="item" style="--i:${i}"><div class="body">${esc(n.body)}</div>
      <div class="row" style="margin-top:9px">${counts(n)}<span class="meta">${F(n.date)}</span><span class="grow"></span>
        <button class="quiet" data-reuse="${n.substack_id}">${icon("plus")}Riusa come bozza</button><a class="quiet" href="https://substack.com/note/c-${n.substack_id}" target="_blank" rel="noopener">${icon("ext")}Apri</a></div></div>`).join("")}</div>`
    : empty("Nessuna Note in questo periodo", "Premi Importa storico per scaricare le tue Notes da Substack, oppure allarga il periodo.")}`;
  $("#days").onchange = (e) => { statDays = +e.target.value; render(); };
  // Subscriber sources come straight from Substack's dashboard; shown only when the call works.
  api("/sources?days=" + Math.min(statDays, 365)).then((r) => {
    const box = $("#sources"); if (!box || tab !== "stats") return;
    const nums = (m) => Object.entries(m).filter(([, x]) => typeof x === "number").map(([k, x]) => `${esc(k.replace(/_/g, " "))} ${x}`).join(" · ");
    const label = (m) => esc(m.name ?? m.label ?? "");
    box.innerHTML = `<div class="sec" style="margin-top:0"><h2>Da dove arrivano gli iscritti</h2><span class="n mono">${r.days} giorni</span></div>
      <div class="row" style="gap:26px;margin-bottom:10px">${r.totals.map((t) => `<div><b class="mono" style="font-size:22px;font-weight:500">${t.total ?? ""}</b><div class="meta">${label(t)}</div></div>`).join("")}</div>
      <div class="list">${r.sources.map((x) => `<div class="item" style="padding:10px 2px"><div class="row"><b style="font-weight:500" class="grow">${esc(x.name)}</b><span class="meta mono">${x.metrics.map((m) => `${label(m)} ${nums(m)}`).join(" | ")}</span></div>
        ${x.children.length ? `<div class="meta" style="margin-top:4px">${x.children.map((ch) => `${esc(ch.name)}: <span class="mono">${ch.metrics.map((m) => `${label(m)} ${nums(m)}`).join(", ")}</span>`).join(" · ")}</div>` : ""}</div>`).join("")}</div>`;
  }).catch(() => {});
  $("#syncNow").onclick = (e) => act(e.currentTarget, async () => { const r = await api("/sync", "POST"); toast(`Sincronizzate ${r.myNotes} Notes`); render(); });
  $("#syncDeep").onclick = (e) => act(e.currentTarget, async () => { const r = await api("/sync?deep=1", "POST"); toast(`Importate ${r.myNotes} Notes`); render(); });
  v.onclick = (e) => { const b = e.target.closest("[data-reuse]"); if (b) act(b, async () => { await api("/notes", "POST", { body: d.top.find((n) => n.substack_id === b.dataset.reuse).body }); toast("Copiata nelle bozze"); }); };
};

// ---------- Attività ----------
views.activity = async (v) => {
  const items = await api("/activity"); let cur = 0;
  v.innerHTML = `
    <div class="head"><div><h1>Attività</h1><p class="lede">Risposte alle tue Notes degli ultimi 14 giorni ancora senza replica. <kbd>J</kbd> <kbd>K</kbd> per scorrere, <kbd>R</kbd> per rispondere, <kbd>E</kbd> per archiviare. Le nuove risposte vengono lette una volta al giorno.</p></div></div>
    <div class="list" style="max-width:820px">${items.map((a, i) => `
      <div class="item act" data-id="${a.reply_id}" style="--i:${i}">
        <div class="meta clamp" style="-webkit-line-clamp:1"><span>Sulla tua Note:</span> ${nt(a.note_body || "")}</div>
        <p style="margin:8px 0 4px"><b style="font-weight:600" data-nt>${esc(a.author_name || a.author_handle || "Qualcuno")}</b> <span class="meta">${F(a.date)}</span></p>
        <div class="body">${esc(a.body)}</div>
        <div class="row" style="margin-top:12px"><input class="grow reply" placeholder="Scrivi una risposta…">
          ${settings.ai_drafts ? `<button class="ghost" data-a="suggest" title="Suggerisci una risposta">${icon("wand")}Suggerisci</button>` : ""}<button class="btn" data-a="reply">${icon("send")}Rispondi</button>
          <button class="quiet" data-a="done" title="Archivia">${icon("check")}</button><a class="quiet" href="https://substack.com/note/c-${a.reply_id}" target="_blank" rel="noopener" title="Apri su Substack">${icon("ext")}</a></div>
      </div>`).join("")}</div>
    ${items.length ? "" : empty("Tutto fatto", "Nessuna risposta in sospeso. Le nuove vengono lette una volta al giorno.")}`;
  const cards = () => $$(".act", v);
  const focus = () => { cards().forEach((c, i) => c.classList.toggle("focus", i === cur)); cards()[cur]?.scrollIntoView({ block: "nearest" }); };
  const run = (el, btn, a) => act(btn, async () => {
    const input = $(".reply", el);
    if (a === "suggest") { input.placeholder = "Sto pensando…"; try { input.value = (await api(`/activity/${el.dataset.id}/suggest`, "POST")).reply; } finally { input.placeholder = "Scrivi una risposta…"; } return input.focus(); }
    if (a === "reply") { if (!input.value.trim()) throw new Error("Scrivi la risposta"); await api(`/activity/${el.dataset.id}/reply`, "POST", { body: input.value.trim() }); toast("Risposta inviata"); }
    else await api(`/activity/${el.dataset.id}/done`, "POST");
    el.remove(); cur = Math.max(0, Math.min(cur, cards().length - 1)); focus(); drawNav({ activity: cards().length });
  });
  v.onclick = (e) => { const b = e.target.closest("[data-a]"); if (b) run(b.closest(".act"), b, b.dataset.a); };
  v.onkeydown = (e) => { if (e.target.classList.contains("reply")) { if (e.key === "Enter") run(e.target.closest(".act"), null, "reply"); if (e.key === "Escape") e.target.blur(); } };
  document.onkeydown = (e) => {
    if (tab !== "activity" || /INPUT|TEXTAREA|SELECT/.test(e.target.tagName) || !cards().length || e.metaKey || e.ctrlKey) return;
    const k = e.key.toLowerCase();
    if (k === "j") { cur = Math.min(cur + 1, cards().length - 1); focus(); }
    if (k === "k") { cur = Math.max(cur - 1, 0); focus(); }
    if (k === "r") { e.preventDefault(); $(".reply", cards()[cur]).focus(); }
    if (k === "s" && settings.ai_drafts) run(cards()[cur], null, "suggest");
    if (k === "e") run(cards()[cur], null, "done");
  };
  focus();
};

// ---------- Persone ----------
let peopleTab = "circle", peopleFilter = "", peopleSide = "subs", creatorFilter = "";
// A tag names one person; the same tag used as a filter names a group, so it is shown in the plural.
const TAG_GROUP = { lettore: "Lettori", "potenziale cliente": "Potenziali clienti", cliente: "Clienti", ambasciatore: "Ambasciatori", imprenditore: "Imprenditori", competitor: "Competitor", coopetitor: "Coopetitor", affine: "Affini", ispirazione: "Ispirazioni" };
const sideSwitch = (subs, creators) => `<div class="side"><button data-side="subs" class="${peopleSide === "subs" ? "on" : ""}">${icon("users")}<span>Iscritti</span> <span class="mono">${subs}</span></button><button data-side="creators" class="${peopleSide === "creators" ? "on" : ""}">${icon("chart")}<span>Creator</span> <span class="mono">${creators}</span></button></div>`;
const avatar = (p) => p.photo_url ? `<img class="avatar" src="${esc(p.photo_url)}" alt="" loading="lazy" referrerpolicy="no-referrer">` : `<span class="avatar" data-nt>${esc((p.name || "?")[0])}</span>`;

function viewCreators(v, d, subsCount) {
  const all = d.people.filter((p) => p.kind === "creator"), watched = all.filter((p) => p.watched).length;
  const list = all.filter((p) => !creatorFilter || p.tag === creatorFilter).sort((a, b) => (b.watched - a.watched) || ((b.followers || 0) - (a.followers || 0)));
  const kpi = (val, label) => val == null ? "" : `<div><b>${val}</b><span>${label}</span></div>`;
  const row = (p, i) => { const r = p.radar || {};
    return `<div class="item creator" data-id="${p.user_id}" style="--i:${Math.min(i, 12)}">
      ${avatar(p)}
      <div>
        <div class="row"><b style="font-weight:600" data-nt>${esc(p.name || p.handle || "?")}</b>${p.handle ? `<a class="meta" data-nt href="https://substack.com/@${esc(p.handle)}" target="_blank" rel="noopener">@${esc(p.handle)}</a>` : ""}${p.sub_state === "paid" || p.sub_state === "free" ? `<span class="tag ok">${SUB_LABEL[p.sub_state]}</span>` : ""}</div>
        <div class="meta">${p.publication ? nt(p.publication) : "Nessuna pubblicazione"}</div>
        ${p.watched ? `<div class="kpis" style="margin-top:12px">
          ${kpi(p.followers, "follower")}${r.growth && r.growth.days > 1 ? kpi((r.growth.delta >= 0 ? "+" : "") + r.growth.delta, `in ${r.growth.days} giorni`) : ""}${kpi(p.subscribers ? nt(p.subscribers) : null, "iscritti")}
          ${kpi(r.notes_per_day, "Notes al giorno")}${kpi(r.avg_interactions, "interazioni medie")}${kpi(r.with_link != null ? r.with_link + "%" : null, "Notes con link")}${kpi(r.avg_length, "caratteri in media")}${kpi(r.usual_hour != null ? r.usual_hour + ":00" : null, "ora più frequente")}
          ${kpi(r.posts_per_week, "articoli a settimana")}${kpi(r.paid_share != null ? r.paid_share + "%" : null, "articoli riservati")}</div>
          ${r.notes_seen ? "" : `<p class="meta" style="margin:10px 0 0">In osservazione: i primi dati arrivano con la prossima lettura giornaliera.</p>`}
          ${r.top ? `<div style="margin-top:12px"><h2 style="margin-bottom:4px"><span>La sua Note migliore</span>${r.top.times ? ` · <span class="mono">${r.top.times}</span> <span>volte la sua media</span>` : ""}</h2><div class="body clamp">${esc(r.top.body)}</div></div>` : ""}
          ${r.last_post ? `<div class="meta" style="margin-top:8px"><span>Ultimo articolo:</span> <a href="${esc(r.last_post.url)}" target="_blank" rel="noopener" data-nt>${esc(r.last_post.title)}</a> ${F(r.last_post.date, { day: "numeric", month: "short" })}</div>` : ""}
          ${p.topics ? `<div style="margin-top:12px"><h2 style="margin-bottom:4px"><span>Argomenti e strategia</span> · ${F(p.topics.at, { day: "numeric", month: "short" })}</h2><div class="reader" style="font-size:14px" data-nt>${p.topics.items.map((t) => `<p>${esc(t)}</p>`).join("")}</div></div>` : ""}`
        : `<p class="meta" style="margin:8px 0 0">Non in osservazione: attivala per raccogliere frequenza, formati e risultati.</p>`}

        ${p.watched && settings.ai_drafts ? `<button class="ghost" data-topics>${icon("wand")}Analizza argomenti</button>` : ""}
        <div class="row"><button class="quiet" data-tosub title="Sposta tra gli iscritti">${icon("users")}</button><button class="quiet danger" data-del title="Rimuovi">${icon("x")}</button></div>
      </div></div>`; };
  v.innerHTML = `
    <div class="head"><div><h1>Persone</h1><p class="lede">I creator che studi: competitor, coopetitor, affini. Per quelli in osservazione l'app legge una volta al giorno Notes, articoli e profilo pubblici, e ne ricava frequenza, formati e risultati.</p></div>${sideSwitch(subsCount, all.length)}</div>
    <div class="row" style="margin-bottom:18px;gap:12px"><div class="tabs"><button data-cf="" class="${creatorFilter ? "" : "on"}">Tutti</button>${d.creator_tags.map((t) => `<button data-cf="${t}" class="${creatorFilter === t ? "on" : ""}">${TAG_GROUP[t]}</button>`).join("")}</div>
      <span class="meta"><span>In osservazione</span> <span class="mono">${watched}/${d.watched_max}</span></span><span class="grow"></span>

  $("#pAdd").onclick = (e) => act(e.currentTarget, async () => { const r = await api("/people", "POST", { handle: $("#pHandle").value, kind: "creator" }); if (watched < d.watched_max) await api(`/people/${r.user_id}/watch`, "POST", { on: true }); toast(tr("Aggiunto") + " " + (r.name || "")); render(); });
  v.onclick = (e) => {
    const sd = e.target.closest("[data-side]"); if (sd) { peopleSide = sd.dataset.side; return render(); }

    const el = e.target.closest(".creator"), b = e.target.closest("button"); if (!el || !b) return; const id = el.dataset.id;
    if (b.dataset.del !== undefined) act(b, async () => { if (!confirm("Rimuovere questa persona e i suoi dati dall'app?")) return; await api(`/people/${id}/watch`, "POST", { on: false }); await api("/people/" + id, "DELETE"); render(); });

  };
  v.onchange = (e) => { const el = e.target.closest(".creator"); if (!el) return; const id = el.dataset.id;
    if (e.target.matches("[data-tag]")) act(null, async () => { await api("/people/" + id, "PUT", { tag: e.target.value || null }); toast("Etichetta salvata"); });
    if (e.target.matches("[data-watch]")) act(null, async () => { try { await api(`/people/${id}/watch`, "POST", { on: e.target.checked }); } finally { render(); } });
  };
}

        ${peopleTab === "suggested" ? `<button class="quiet" data-dismiss>Ignora</button>` : `<button class="quiet danger" data-del title="Rimuovi">${icon("x")}</button>`}</div></div>`;
  const empties = { circle: ["La tua cerchia è vuota", "Sono le persone che scegli di seguire da vicino. Aggiungile dai Suggeriti, da Tutti, o cercando un profilo con il campo in alto."],
    suggested: ["Nessun suggerimento per ora", "Qui compaiono le persone che ti rispondono, che risultano iscritte alla tua pubblicazione o che pagano già altre newsletter. I profili si leggono una volta al giorno."],
    all: ["Ancora nessuno", "Qui compare chi risponde alle tue Notes. Puoi anche cercare qualsiasi profilo Substack con il campo in alto."] };
  v.innerHTML = `
    <div class="head"><div><h1>Persone</h1><p class="lede">Chi ti legge: la cerchia di chi segui da vicino e i suggerimenti su chi aggiungere. I messaggi li scrivi e li invii tu: l'app prepara, ricorda e tiene il registro.</p></div>
      ${sideSwitch(subs.length, creatorsCount)}</div>
    <div class="row" style="margin-bottom:18px;gap:12px"><div class="tabs"><button data-pt="circle" class="${peopleTab === "circle" ? "on" : ""}">Cerchia <span class="mono">${circle.length}</span></button><button data-pt="suggested" class="${peopleTab === "suggested" ? "on" : ""}">Suggeriti <span class="mono">${suggested.length}</span></button><button data-pt="all" class="${peopleTab === "all" ? "on" : ""}">Tutti <span class="mono">${subs.length}</span></button></div>
      <select id="pTag" class="auto"><option value="">Tutte le etichette</option>${d.sub_tags.map((t) => `<option value="${t}" ${peopleFilter === t ? "selected" : ""}>${TAG_GROUP[t]}</option>`).join("")}</select><span class="grow"></span><input id="pHandle" class="auto" placeholder="@handle o link al profilo" style="width:220px"><button class="btn" id="pAdd">${icon("plus")}Cerca e aggiungi</button></div>

  $("#pAdd").onclick = (e) => act(e.currentTarget, async () => { const r = await api("/people", "POST", { handle: $("#pHandle").value }); toast(tr("Aggiunto") + " " + (r.name || "")); peopleTab = "circle"; render(); });
  $("#pTag").onchange = (e) => { peopleFilter = e.target.value; render(); };

    const sd = e.target.closest("[data-side]"); if (sd) { peopleSide = sd.dataset.side; return render(); }
    const t = e.target.closest("[data-pt]"); if (t) { peopleTab = t.dataset.pt; return render(); }
    const mv = e.target.closest("[data-tocreator]"); if (mv) return act(mv, async () => { await api("/people/" + mv.closest(".person").dataset.id, "PUT", { kind: "creator", tag: null }); toast("Spostato tra i creator"); render(); });
    const el = e.target.closest(".person"); if (!el) return; const id = el.dataset.id, b = e.target.closest("button"); if (!b) return;
    if (b.dataset.del !== undefined) act(b, async () => { if (!confirm("Rimuovere questa persona e i suoi dati dall'app?")) return; await api("/people/" + id, "DELETE"); render(); });

    if (b.dataset.dismiss !== undefined) act(b, async () => { await api("/people/" + id, "PUT", { dismissed: true }); render(); });
    if (b.dataset.open !== undefined) openPerson(d.people.find((p) => p.user_id == id), d.sub_tags);
  };
};

// One person's card: status, notes, next step, a message to adapt and the log of what was sent.
async function openPerson(p, tags) {
  const d = $("#editor"); const log = await api(`/people/${p.user_id}/contacts`);
  const KINDS = { benvenuto: "Benvenuto", grazie: "Ringraziamento", domanda: "Domanda per conoscerlo", invito: "Invito all'offerta" };
  const dateIn = (ms) => ms ? new Date(ms - new Date(ms).getTimezoneOffset() * 60000).toISOString().slice(0, 10) : "";
  d.innerHTML = `<form method="dialog" class="dlg">
    <div class="row"><h1 style="font-size:18px" class="grow" data-nt>${esc(p.name || p.handle || "?")}</h1><button class="quiet" value="close" title="Chiudi">${icon("x")}</button></div>
    ${p.reasons.length ? `<div class="subs">${p.reasons.map((r) => `<span class="tag">${r}</span>`).join("")}</div>` : ""}
    <div class="cols">
      <div class="field" style="margin:0"><label for="cSub">Rapporto con te</label><select id="cSub"><option value="">Come risulta dal profilo pubblico</option>${Object.entries(SUB_LABEL).map(([k, l]) => `<option value="${k}" ${p.sub_manual === k ? "selected" : ""}>${l}</option>`).join("")}</select></div>
      <div class="field" style="margin:0"><label for="cTag">Etichetta</label><select id="cTag"><option value="">Senza etichetta</option>${tags.map((t) => `<option value="${t}" ${p.tag === t ? "selected" : ""}>${t}</option>`).join("")}</select></div>
      <div class="field" style="margin:0"><label for="cNext">Prossimo passo</label><input id="cNext" value="${esc(p.next_step || "")}" placeholder="Per esempio: chiedere cosa sta scrivendo"></div>
      <div class="field" style="margin:0"><label for="cDate">Quando</label><input id="cDate" type="date" value="${dateIn(p.next_date)}"></div>
    </div>
    <div class="field" style="margin:0"><label for="cNote">Appunti</label><textarea id="cNote" style="min-height:70px" placeholder="Cosa sai di questa persona, cosa le interessa">${esc(p.note || "")}</textarea></div>
    <div class="field" style="margin:0"><label for="cMsg">Messaggio da inviare tu</label>
      <div class="row"><select id="cKind" class="auto">${Object.entries(KINDS).map(([k, l]) => `<option value="${k}">${l}</option>`).join("")}</select>
        ${settings.ai_drafts ? `<button type="button" class="ghost" id="cDraft">${icon("wand")}Proponi una traccia</button>` : ""}<span class="grow"></span><button type="button" class="quiet" id="cCopy">Copia</button></div>
      <textarea id="cMsg" style="min-height:90px" placeholder="Scrivi qui il messaggio, poi copialo e invialo da Substack"></textarea>
      <span class="help">L'app non invia nulla. Dopo averlo spedito, registralo qui sotto.</span></div>
    <div class="row"><input id="cOutcome" class="grow" placeholder="Com'è andata (facoltativo)"><button type="button" class="ghost" id="cLog">${icon("check")}Registra contatto</button></div>
    ${log.length ? `<div class="list" style="max-height:170px;overflow:auto">${log.map((k) => `<div class="item" style="padding:9px 2px"><div class="meta">${F(k.date, { day: "numeric", month: "short", year: "numeric" })}${k.kind ? ` · <span>${KINDS[k.kind] || esc(k.kind)}</span>` : ""}</div>${k.text ? `<div class="body clamp">${esc(k.text)}</div>` : ""}${k.outcome ? `<div class="meta" data-nt>${esc(k.outcome)}</div>` : ""}</div>`).join("")}</div>` : ""}
    <div class="row"><button type="button" class="quiet danger" id="cOut">Togli dalla cerchia</button><span class="grow"></span><button class="ghost" value="close">Annulla</button><button type="button" class="btn" id="cSave">${icon("check")}Salva</button></div>
  </form>`;
  const id = p.user_id, close = () => { d.close(); render(); };
  const save = () => api("/people/" + id, "PUT", { sub_manual: $("#cSub", d).value || null, tag: $("#cTag", d).value || null, next_step: $("#cNext", d).value, next_date: $("#cDate", d).value ? new Date($("#cDate", d).value + "T12:00").getTime() : null, note: $("#cNote", d).value });
  $("#cSave", d).onclick = (e) => act(e.currentTarget, async () => { await save(); toast("Scheda salvata"); close(); });
  $("#cOut", d).onclick = (e) => act(e.currentTarget, async () => { await api("/people/" + id, "PUT", { circle: false }); close(); });
  $("#cCopy", d).onclick = async () => { try { await navigator.clipboard.writeText($("#cMsg", d).value); toast("Messaggio copiato"); } catch { toast("Copia non riuscita: seleziona il testo a mano"); } };
  if ($("#cDraft", d)) $("#cDraft", d).onclick = (e) => act(e.currentTarget, async () => { $("#cMsg", d).placeholder = "Sto pensando…"; try { $("#cMsg", d).value = (await api(`/people/${id}/message`, "POST", { kind: $("#cKind", d).value })).message; } finally { $("#cMsg", d).placeholder = "Scrivi qui il messaggio, poi copialo e invialo da Substack"; } });
  $("#cLog", d).onclick = (e) => act(e.currentTarget, async () => { await save(); await api(`/people/${id}/contacts`, "POST", { kind: $("#cKind", d).value, text: $("#cMsg", d).value, outcome: $("#cOutcome", d).value }); toast("Contatto registrato"); d.close(); await render(); });
  d.showModal();
}

    <div class="two"><section>
      <div class="list">${d.feed.map((n, i) => `<div class="item" style="--i:${Math.min(i, 12)}"><p style="margin:0 0 5px"><b style="font-weight:600" data-nt>${esc(n.name || n.handle)}</b> <span class="meta">${F(n.date)}</span></p><div class="body">${esc(n.body)}</div>

    </section>
    <section class="panel pad"><h2 style="margin-bottom:12px">Chi segui <span class="mono">${d.follows.length}/10</span></h2>
      <div class="row" style="margin-bottom:12px"><input id="fHandle" class="grow" placeholder="@handle o link al profilo"><button class="btn" id="fAdd">${icon("plus")}Aggiungi</button></div>
      <div class="list">${d.follows.map((f) => `<div class="item row" style="padding:9px 2px"><span class="grow" data-nt>${esc(f.name || f.handle)}<span class="meta"> @${esc(f.handle)}</span></span><button class="quiet danger" data-rm="${esc(f.handle)}" title="Smetti di seguire">${icon("x")}</button></div>`).join("")}</div>
    </section></div>`;
  const inspHtml = `<div class="list" style="max-width:820px">${insp.map((n, i) => `<div class="item" style="--i:${i}"><p style="margin:0 0 5px"><b style="font-weight:600" data-nt>${esc(n.name || n.handle)}</b> <span class="meta">salvata ${F(n.saved_at, { day: "numeric", month: "short" })}</span></p><div class="body">${esc(n.body)}</div>
      <div class="row" style="margin-top:9px">${settings.ai_drafts ? `<button class="ghost" data-remix="${n.substack_id}">${icon("spark")}Scrivi 3 bozze mie da questo spunto</button>` : ""}<span class="grow"></span><button class="quiet danger" data-unsave="${n.substack_id}">${icon("trash")}Rimuovi</button></div></div>`).join("")}</div>
    ${insp.length ? "" : empty("Nessuna ispirazione salvata", "Dal feed dei creator seguiti, salva le Notes che funzionano: Claude ne riprende l'idea e la forma, non le frasi.")}`;

  v.onclick = (e) => {
    const b = e.target.closest("button"); if (!b) return; const ds = b.dataset;
    if (ds.ft) { feedTab = ds.ft; return render(); }
    if (ds.rm) act(b, async () => { await api("/follows/" + encodeURIComponent(ds.rm), "DELETE"); render(); });

    if (ds.unsave) act(b, async () => { await api("/inspirations/" + ds.unsave, "DELETE"); render(); });

};

    </div>`;
  $("#sSave").onclick = (e) => act(e.currentTarget, async () => {
    await api("/settings", "PUT", { publish_mode: $("#sMode").value, alert_url: $("#sAlert").value, language: $("#sLang").value, handle: $("#sHandle").value, cookie: $("#sCookie").value || undefined, timezone: $("#sTz").value, slots: $$("#sSlotChips [data-slot]").map((c) => c.dataset.slot), slot_days: $$("#sDays .chip.on").map((c) => +c.dataset.d) });
    const fresh = await api("/settings"); if (fresh.language !== LANG) { await setLang(fresh.language); settings = fresh; drawNav(); drawStatus(); }
    toast("Impostazioni salvate"); render();
  });
  for (const [id, key, msg] of [["#sPaused", "paused", ["Pausa attivata", "Pausa tolta"]], ["#sAi", "ai_drafts", ["Aiuto di Claude attivato", "Aiuto di Claude disattivato"]]]) {
    $(id).onchange = (e) => act(null, async () => { await api("/settings", "PUT", { [key]: e.target.checked }); settings = await api("/settings"); drawNav(); drawStatus(); toast(msg[e.target.checked ? 0 : 1]); });
  }
  $("#sSlotChips").onclick = (e) => { const c = e.target.closest("[data-slot]"); if (c) c.parentNode.removeChild(c); };
  $("#sDays").onclick = (e) => { const c = e.target.closest(".chip"); if (c) c.classList.toggle("on"); };
  $("#sSlotAdd").onclick = () => { const t = $("#sSlotNew").value; if (!t) return; if (!$(`#sSlotChips [data-slot="${t}"]`)) $("#sSlotChips").insertAdjacentHTML("beforeend", `<button type="button" class="chip on mono" data-slot="${t}" title="Togli">${t} ×</button>`); $("#sSlotNew").value = ""; toast("Orario aggiunto: premi Salva per confermare"); };
  $("#sAlertTest").onclick = (e) => act(e.currentTarget, async () => {
    await api("/settings", "PUT", { alert_url: $("#sAlert").value });
    const r = await api("/alerts/test", "POST"); drawAlerts();
    toast(r.pushed ? "Avviso di prova inviato" : $("#sAlert").value.trim() ? "L'indirizzo non ha accettato il messaggio: l'avviso compare solo nell'app" : "Nessun indirizzo per le notifiche: l'avviso compare solo nell'app");
  });
  $("#sConn").onclick = (e) => act(e.currentTarget, async () => {
    if (s.has_connector && !confirm("L'indirizzo attuale smetterà di funzionare. Continuare?")) return;
    const r = await api("/connector", "POST");
    $("#conn").innerHTML = `<div class="field" style="margin:10px 0"><label for="connUrl">Indirizzo del connettore</label><input id="connUrl" class="mono" readonly data-nt value="${esc(r.url)}">
      <span class="help">Copialo adesso: non verrà più mostrato. In Claude: Impostazioni, Connettori, Aggiungi connettore personalizzato, incolla l'indirizzo e scegli l'accesso senza login. Chi ha questo indirizzo può leggere i tuoi dati nell'app: non condividerlo.</span></div>
      <button class="ghost" id="connCopy">Copia</button>`;
    $("#connCopy").onclick = async () => { try { await navigator.clipboard.writeText(r.url); toast("Indirizzo copiato"); } catch { $("#connUrl").select(); toast("Copia non riuscita: seleziona il testo a mano"); } };
  });
  if ($("#sConnOff")) $("#sConnOff").onclick = (e) => act(e.currentTarget, async () => { if (!confirm("Disattivare il connettore?")) return; await api("/connector", "DELETE"); toast("Connettore disattivato"); render(); });
  $("#sExplore").onclick = (e) => act(e.currentTarget, async () => {
    $("#explore").innerHTML = skel(3, 30);
    try {
      const r = await api("/explore", "POST");
      $("#explore").innerHTML = `<div class="item meta">Provati ${r.tried}, funzionanti ${r.found}. Il risultato è salvato: dillo a Claude.</div>` + r.results.map((x) => `<div class="item row" style="padding:7px 2px"><span class="tag ${x.status === 200 ? "ok" : ""} mono">${x.status}</span><span class="meta mono grow" style="overflow-wrap:anywhere">${esc(x.url.replace(/^https:\/\/[^/]+\/api\/v1/, ""))}</span></div>`).join("");
    } catch (err) { $("#explore").innerHTML = ""; throw err; }
  });
  $("#sTest").onclick = (e) => act(e.currentTarget, async () => {
    $("#diag").innerHTML = skel(4, 40);
    const r = await api("/diagnostics");
    $("#diag").innerHTML = r.map((x, i) => `<div class="item row" style="--i:${i};padding:10px 2px"><span class="tag ${x.ok ? "ok" : "bad"}">${icon(x.ok ? "check" : "x")}</span><span>${esc(x.check)}</span><span class="grow"></span><span class="meta" style="text-align:right">${esc(x.detail)}</span></div>`).join("");
    settings = await api("/settings"); drawStatus();
  });
};

setLang(LANG).then(() => boot().catch(showLogin));
</script>
</body>
</html>
